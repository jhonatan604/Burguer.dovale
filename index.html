<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burguer do Vale · Cardápio e pedidos</title>
<meta name="theme-color" content="#1A110B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style id="css">:root{
  --brasa:#1A110B; --brasa2:#211610; --tabua:#2B1D14; --tabua2:#3A281B; --linha:rgba(243,221,179,.12);
  --ouro:#E8AA32; --ouro2:#F6C760; --cheddar:#F2B33D;
  --pao:#F5E2BE; --pao-dim:#C7AF8A; --verde:#B8D98A; --erro:#F08A6B;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--brasa)}
body{background:var(--brasa);color:var(--pao);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brasa)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.display{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.2px}
h2.display{font-size:clamp(34px,9.5vw,48px);line-height:1}

/* HERO */
.hero{position:relative;height:72svh;min-height:480px;max-height:760px;overflow:hidden}
.hero-img{position:absolute;inset:-8% 0 auto 0;height:116%;width:100%;object-fit:cover;object-position:50% 58%;will-change:transform;transform-origin:50% 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,17,11,.55) 0%,rgba(26,17,11,0) 26%,rgba(26,17,11,.2) 50%,rgba(26,17,11,.85) 82%,var(--brasa) 100%);pointer-events:none}
.marca{position:absolute;top:18px;left:0;right:0;z-index:2}
.marca .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-family:Anton,Impact,sans-serif;font-size:18px;letter-spacing:1px;color:var(--ouro)}
.logo svg{width:30px;height:30px}
.ig{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(26,17,11,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ig svg{width:20px;height:20px}
.hero-txt{position:absolute;left:0;right:0;bottom:28px;z-index:2;will-change:transform,opacity}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(26,17,11,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 13px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:#C26B4E}
.status.aberto .dot{background:var(--verde);box-shadow:0 0 0 4px rgba(184,217,138,.25)}
.hero h1{font-size:clamp(56px,17vw,104px);line-height:.86;color:var(--ouro);margin:12px 0 8px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.hero-sub{font-size:17px;max-width:32ch;color:var(--pao)}

/* Promoções */
.promos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-top:12px;padding-bottom:2px}
.promos::-webkit-scrollbar{display:none}
.promo{position:relative;flex:none;width:84%;max-width:340px;display:grid;grid-template-columns:1fr 76px;align-items:stretch;gap:0;min-height:76px;border-radius:18px;overflow:hidden;background:var(--ouro);color:var(--brasa);margin-top:0;cursor:pointer;border:0;text-align:left;padding:0;scroll-snap-align:start}
.promo:only-child{width:100%;max-width:none}
.promo .p-txt{padding:10px 4px 10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.promo .selo{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:var(--brasa);color:var(--ouro2);padding:2px 7px;border-radius:999px}
.promo strong{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:19px;line-height:1.05;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo small{font-size:13px;line-height:1.3;margin-top:1px;color:#4A3416;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .p-preco{font-weight:800;font-size:14px;margin-top:2px}
.promo .p-img{position:relative;background:var(--tabua)}
.promo .p-img img,.promo .p-img svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo .p-img::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:22px;z-index:1;background:var(--ouro);clip-path:polygon(0 0,100% 0,0 100%)}

/* Mais pedidos */
.top{padding:26px 0 6px}
.top-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top-cab span{font-size:14px;color:var(--pao-dim);white-space:nowrap}
.trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 20px 8px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trilho::-webkit-scrollbar{display:none}
.card{flex:none;width:148px;scroll-snap-align:start;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.card .c-img{position:relative;width:148px;height:148px;border-radius:22px;overflow:hidden;background:var(--tabua)}
.card .c-img img,.card .c-img svg{width:100%;height:100%;object-fit:cover}
.card .rank{position:absolute;top:8px;left:8px;background:var(--ouro);color:var(--brasa);font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px}
.card strong{display:block;font-size:16px;font-weight:800;line-height:1.2;margin-top:9px}
.card small{display:block;font-size:13px;line-height:1.3;color:var(--pao-dim);margin-top:2px}

/* Abas */
.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(26,17,11,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--linha);margin-top:20px}
.abas .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
.abas .wrap::-webkit-scrollbar{display:none}
.aba{flex:none;padding:9px 17px;border-radius:999px;border:1.5px solid rgba(243,221,179,.2);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.aba.on{background:var(--pao);color:var(--brasa);border-color:var(--pao)}

/* Cardápio */
.cat{padding:30px 0 6px}
.cat-desc{color:var(--pao-dim);font-size:15px;margin:4px 0 8px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--linha)}
.item .thumb{width:84px;height:84px;border-radius:20px;overflow:hidden;background:var(--tabua)}
.item .thumb img,.item .thumb svg{width:100%;height:100%;object-fit:cover}
.item.abre{cursor:pointer}
.item h3{font-size:18px;font-weight:800;line-height:1.2;color:var(--pao)}
.item.casa h3::after{content:"da casa";margin-left:8px;vertical-align:2px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--brasa);background:var(--verde);padding:2px 7px;border-radius:999px}
.item p{color:var(--pao-dim);font-size:14px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preco{font-weight:800;font-size:16px;margin-top:6px;color:var(--ouro2)}
.preco.vazio{color:var(--pao-dim);font-weight:400;font-style:italic;font-size:14px}
.item.esgotado{opacity:.45}
.item.esgotado .preco::after{content:" · Esgotado";font-style:normal;font-weight:800;color:var(--erro)}
.mais-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--ouro);color:var(--brasa);font-size:24px;font-weight:600;cursor:pointer;display:grid;place-items:center;flex:none}
.mais-btn .n{font-size:16px;font-weight:800}
.qtd{display:flex;align-items:center;gap:2px;background:var(--tabua);border-radius:999px;padding:4px}
.qtd button{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:21px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.qtd button.mais{background:var(--ouro);color:var(--brasa)}
.qtd button:disabled{opacity:.3;cursor:default}
.qtd output{min-width:22px;text-align:center;font-weight:800}
.qtd.zero output,.qtd.zero .menos{display:none}
.qtd.zero{background:transparent;padding:0}
.qtd.zero button.mais{width:44px;height:44px;font-size:24px}

.rodape{padding:44px 0 150px;color:var(--pao-dim);font-size:15px}
.rodape .logo{margin-bottom:12px}
.rodape p+p{margin-top:6px}
.rodape a{text-underline-offset:3px;text-decoration-color:var(--ouro)}

/* Barra do pedido */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(26,17,11,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--linha);transform:translateY(110%);transition:transform .3s ease}
.barra.on{transform:none}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:640px;margin:0 auto;min-height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--ouro);color:var(--brasa);font-weight:800;font-size:17px;cursor:pointer;text-decoration:none}
.btn .n{background:var(--brasa);color:var(--ouro);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 8px}
.btn.cheio{justify-content:center}
.btn.sec{background:var(--tabua2);color:var(--pao)}
.btn:disabled{opacity:.4;cursor:default}
.pulse{animation:pulse .45s ease}
@keyframes pulse{50%{transform:scale(1.04)}}

/* Painéis */
.fundo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.fundo.on{opacity:1;pointer-events:auto}
.painel{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;display:flex;flex-direction:column;background:var(--brasa2);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.painel.on{transform:none}
.painel::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(243,221,179,.25)}
.painel-top{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 10px}
.painel-top h2{font-size:34px;margin:0}
.fechar{width:44px;height:44px;border-radius:50%;border:0;background:var(--tabua2);font-size:20px;cursor:pointer;flex:none}
.painel-corpo{overflow-y:auto;padding:0 20px 14px;-webkit-overflow-scrolling:touch}
.painel-pe{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linha)}
.linha{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linha)}
.linha .nome{font-weight:800}
.linha .sub{font-size:14px;color:var(--pao-dim)}
.linha .add{font-size:13px;color:var(--ouro2)}
.linha .nota{font-size:13px;color:var(--verde)}
.linha .qtd{background:var(--tabua2)}
.linha .qtd button{width:34px;height:34px;font-size:19px}
.total{display:flex;justify-content:space-between;padding:16px 0 4px;font-size:20px;font-weight:800}
.total-nota{font-size:14px;color:var(--pao-dim)}
fieldset{border:0;padding:0;margin:22px 0 0}
legend,label.rot{display:block;font-size:14px;font-weight:600;color:var(--pao-dim);margin-bottom:8px}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes label{position:relative}
.opcoes input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opcoes span{display:block;padding:10px 16px;border-radius:999px;border:1.5px solid rgba(243,221,179,.22);font-weight:600;font-size:15px}
.opcoes input:checked+span{background:var(--pao);color:var(--brasa);border-color:var(--pao)}
.opcoes input:focus-visible+span{outline:3px solid var(--verde);outline-offset:2px}
.campo{margin-top:18px}
.campo input,.campo textarea,.campo select{width:100%;background:var(--brasa);border:1.5px solid rgba(243,221,179,.18);border-radius:14px;padding:13px 14px;font-size:16px}
.campo textarea{min-height:76px;resize:vertical}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--ouro);outline:none}
.campo.erro input{border-color:var(--erro)}
.msg-erro{color:var(--erro);font-size:14px;margin-top:6px;display:none}
.campo.erro .msg-erro{display:block}
.vazio-msg{padding:28px 0;color:var(--pao-dim);text-align:center}

/* Detalhe */
.det-foto{width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--tabua)}
.det-foto img,.det-foto svg{width:100%;height:100%;object-fit:cover}
.det-nome{font-size:40px;line-height:1;margin:18px 0 6px}
.det-desc{color:var(--pao-dim);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{background:var(--tabua2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.adds{display:grid;gap:0}
.adds label{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linha);cursor:pointer}
.adds input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid rgba(243,221,179,.35);display:grid;place-items:center;flex:none;cursor:pointer}
.adds input:checked{background:var(--ouro);border-color:var(--ouro)}
.adds input:checked::after{content:"";width:6px;height:11px;border:solid var(--brasa);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.adds .a-nome{flex:1;font-weight:600}
.adds .a-preco{color:var(--pao-dim);font-size:14px}
.det-pe{display:flex;gap:10px;align-items:center}
.det-pe .btn{flex:1}

/* Painel do dono */
.dono{position:fixed;inset:0;z-index:50;background:var(--brasa);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.dono.on{display:block}
.dono .wrap{max-width:720px}
/* Tela de bloqueio */
.trava{min-height:100%;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
.trava-box{width:100%;max-width:340px;text-align:center}
.trava-box .logo{justify-content:center;margin-bottom:22px}
.trava-box h2{font-size:34px;line-height:1}
.trava-box p{color:var(--pao-dim);font-size:15px;margin-top:8px;min-height:2.6em}
.trava-box p.ruim{color:var(--erro)}
.pontos{display:flex;justify-content:center;gap:14px;margin:22px 0 26px}
.pontos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pao-dim);transition:background .15s,border-color .15s}
.pontos i.on{background:var(--ouro);border-color:var(--ouro)}
.pontos.treme{animation:treme .4s}
@keyframes treme{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.teclado button{height:66px;border-radius:20px;border:0;background:var(--tabua);font-size:26px;font-weight:600;cursor:pointer}
.teclado button:active{background:var(--tabua2)}
.teclado button:disabled{opacity:.35}
.teclado .vz{background:transparent;cursor:default}
.teclado .apagar{background:transparent;font-size:20px}
.trava-sair{margin-top:22px;background:none;border:0;color:var(--pao-dim);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}

/* Cabeçalho e abas */
.d-top{position:sticky;top:0;z-index:5;background:rgba(26,17,11,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--linha);padding-top:env(safe-area-inset-top,0px)}
.d-top .wrap{padding-top:12px;padding-bottom:0}
.d-linha1{display:flex;align-items:center;gap:10px}
.d-linha1 .logo{font-size:16px;flex:1}
.d-linha1 .logo small{font-family:"Bricolage Grotesque",sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--brasa);background:var(--ouro);padding:2px 7px;border-radius:999px;margin-left:4px}
.ic-btn{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(243,221,179,.2);background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.ic-btn svg{width:18px;height:18px}
.d-abas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 0;padding:0 20px}
.d-abas::-webkit-scrollbar{display:none}
.d-aba{flex:none;padding:10px 14px 12px;border:0;background:none;font-weight:600;font-size:15px;color:var(--pao-dim);border-bottom:3px solid transparent;cursor:pointer}
.d-aba.on{color:var(--pao);border-bottom-color:var(--ouro)}
.d-aba .b{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--erro);color:var(--brasa);font-size:11px;font-weight:800}
.d-corpo{padding:22px 0 140px}
.d-h{font-size:26px;font-weight:800;line-height:1.15}
.d-sub{color:var(--pao-dim);font-size:15px;margin-top:4px}

/* Resumo */
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.res{background:var(--brasa2);border:1px solid var(--linha);border-radius:20px;padding:16px;text-align:left;cursor:pointer;width:100%}
.res strong{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:38px;line-height:1;color:var(--ouro)}
.res span{display:block;font-size:14px;color:var(--pao-dim);margin-top:6px;line-height:1.3}
.res.alerta strong{color:var(--erro)}
.res.ok strong{color:var(--verde)}
.dica{display:flex;gap:12px;align-items:flex-start;background:var(--brasa2);border:1px solid var(--linha);border-left:4px solid var(--ouro);border-radius:14px;padding:14px;margin-top:12px;font-size:15px}
.dica.ruim{border-left-color:var(--erro)}
.dica b{display:block}
.dica button{margin-top:8px}

/* Lista de itens */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lista{margin-top:14px;background:var(--brasa2);border:1px solid var(--linha);border-radius:20px;overflow:hidden}
.lin{border-top:1px solid var(--linha)}
.lin:first-child{border-top:0}
.lin-cab{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px}
.lin-cab .thumb{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--tabua)}
.lin-cab .thumb img,.lin-cab .thumb svg{width:100%;height:100%;object-fit:cover}
.lin-nome{font-weight:800;line-height:1.2;min-width:0}
.lin-nome small{display:block;font-weight:400;font-size:13px;color:var(--pao-dim)}
.lin-nome small.ruim{color:var(--erro)}
.preco-in{display:flex;align-items:center;background:var(--brasa);border:1.5px solid rgba(243,221,179,.18);border-radius:12px;padding:0 10px;width:104px}
.preco-in:focus-within{border-color:var(--ouro)}
.preco-in span{font-size:14px;color:var(--pao-dim)}
.preco-in input{width:100%;background:transparent;border:0;padding:10px 0 10px 6px;font-size:16px;font-weight:600;outline:none}
.abrir-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--tabua);cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.abrir-btn svg{width:16px;height:16px}
.lin.aberta .abrir-btn{transform:rotate(180deg)}
.lin-det{display:none;padding:4px 14px 18px 78px}
.lin.aberta .lin-det{display:block}
.lin-det .campo{margin-top:12px}
.lin-det .campo:first-child{margin-top:0}
.dica-campo{font-size:13px;color:var(--pao-dim);margin-top:5px}
.d-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chip-btn{border:1.5px solid rgba(243,221,179,.22);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip-btn.on{background:var(--pao);color:var(--brasa);border-color:var(--pao)}
.chip-btn.perigo{border-color:rgba(240,138,107,.5);color:var(--erro)}
.chip-btn.forte{background:var(--ouro);border-color:var(--ouro);color:var(--brasa)}
.add-novo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:0;border-top:1px dashed rgba(243,221,179,.22);background:transparent;font-weight:800;color:var(--ouro2);cursor:pointer}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--tabua2);position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--pao);transition:transform .2s}
.toggle input:checked{background:var(--erro)}
.toggle.verde input:checked{background:var(--verde)}
.toggle input:checked::after{transform:translateX(18px)}
.lin.esg .lin-nome{opacity:.5}

/* Promo prévia */
.promo-ed{margin-top:14px;background:var(--brasa2);border:1px solid var(--linha);border-radius:22px;padding:14px}
.promo-ed .promo{margin-top:0;cursor:default;width:100%;max-width:none}
.promo-ed.off .promo{filter:grayscale(.8);opacity:.5}
.promo-ed .campo{margin-top:12px}

/* Destaques */
.dest{display:grid;grid-template-columns:auto 52px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--linha)}
.dest:first-child{border-top:0}
.dest .pos{font-family:Anton,Impact,sans-serif;font-size:24px;color:var(--ouro);width:28px;text-align:center}
.dest .thumb{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--tabua)}
.dest .thumb img,.dest .thumb svg{width:100%;height:100%;object-fit:cover}
.dest input{width:100%;background:var(--brasa);border:1.5px solid rgba(243,221,179,.18);border-radius:10px;padding:8px 10px;font-size:15px;margin-top:4px}
.ordem{display:flex;flex-direction:column;gap:4px}
.ordem button{width:34px;height:28px;border-radius:9px;border:0;background:var(--tabua);cursor:pointer;font-size:14px}
.ordem button:disabled{opacity:.3}

/* Barra de publicar */
.d-pub{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(26,17,11,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--linha);transform:translateY(110%);transition:transform .3s}
.d-pub.on{transform:none}
.d-pub .wrap{display:flex;gap:10px;align-items:center}
.d-pub .txt{flex:1;font-size:14px;line-height:1.3}
.d-pub .txt b{display:block;font-size:16px}
.d-pub .btn{width:auto;min-height:50px;padding:0 22px;margin:0}

/* Modal e aviso */
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,.6);padding:20px}
.modal.on{display:grid}
.modal-box{width:100%;max-width:380px;background:var(--brasa2);border:1px solid var(--linha);border-radius:24px;padding:22px}
.modal-box h3{font-size:22px;font-weight:800}
.modal-box p{color:var(--pao-dim);font-size:15px;margin-top:6px}
.modal-box ul{margin:10px 0 0;padding-left:18px;color:var(--pao);font-size:15px}
.modal-box .d-row{justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--pao);color:var(--brasa);font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;transition:opacity .25s,transform .25s;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ruim{background:var(--erro)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.pontos.treme{animation:none}.d-pub,.toast{transition:none}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hero-img,.hero-txt{transform:none!important}
  .painel,.barra,.fundo{transition:none}
  .pulse{animation:none}
}
</style>

/* ---------- Ilustrações (para itens sem foto) ---------- */
function onda(y,h,cor,amp,n,drip){
  var x0=22,x1=178,w=(x1-x0)/n,d='M'+x0+' '+(y+h);
  d+=' L'+x0+' '+(y+amp);
  for(var i=0;i<n;i++){ var a=x0+i*w; d+=' Q'+(a+w/2)+' '+(y-amp)+' '+(a+w)+' '+(y+amp); }
  d+=' L'+x1+' '+(y+h);

  if(drip){ for(var k=0;k<drip;k++){ var cx=44+k*(112/Math.max(1,drip-1)); s+='<path d="M'+(cx-6)+' '+(y+h-1)+' Q'+cx+' '+(y+h+14)+' '+(cx+6)+' '+(y+h-1)+'Z" fill="'+cor+'"/>'; } }
  return s;
}
var CAMADAS={
  paoB:{h:24,f:function(y){return '<path d="M26 '+y+'H174Q177 '+y+' 175 '+(y+7)+'L169 '+(y+20)+'Q167 '+(y+24)+' 161 '+(y+24)+'H39Q33 '+(y+24)+' 31 '+(y+20)+'L25 '+(y+7)+'Q23 '+y+' 26 '+y+'Z" fill="#DE9A4C"/><rect x="26" y="'+y+'" width="148" height="5" rx="2.5" fill="#F0C887"/>';}},
  paoT:{h:54,f:function(y){var b=y+54;return '<path d="M24 '+b+'Q22 '+y+' 100 '+y+'Q178 '+y+' 176 '+b+'Z" fill="#E3963F"/><path d="M40 '+(b-14)+'Q46 '+(y+14)+' 100 '+(y+10)+'" stroke="#F3C07A" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>'+[[70,18],[96,13],[122,17],[84,30],[112,28],[140,30],[58,32]].map(function(p){return '<ellipse cx="'+p[0]+'" cy="'+(y+p[1])+'" rx="3.2" ry="1.8" fill="#FBE6BD"/>';}).join('');}},
  carne:{h:20,f:function(y){return '<rect x="24" y="'+y+'" width="152" height="20" rx="10" fill="#6A3820"/><path d="M40 '+(y+7)+'h22M78 '+(y+12)+'h26M120 '+(y+7)+'h30" stroke="#4A2412" stroke-width="3" stroke-linecap="round"/>';}},
  frango:{h:18,f:function(y){var s='';[24,52,82,110,140].forEach(function(x,i){s+='<rect x="'+x+'" y="'+(y+(i%2?2:0))+'" width="34" height="16" rx="7" fill="'+(i%2?'#C98A4B':'#D9A262')+'"/>';});return s;}},
  alface:{h:13,f:function(y){return onda(y,13,'#6DB33F',6,9)+onda(y+3,8,'#8CCB55',4,9);}},
  tomate:{h:9,f:function(y){return '<rect x="30" y="'+y+'" width="68" height="9" rx="4.5" fill="#D8412C"/><rect x="102" y="'+y+'" width="68" height="9" rx="4.5" fill="#C9362A"/>';}},
  queijo:{h:8,f:function(y){return onda(y,8,'#F5C84B',2,4,4);}},
  cheddar:{h:10,f:function(y){return onda(y,10,'#F39A1E',5,7);}},
  branco:{h:9,f:function(y){return onda(y,9,'#F4EEE2',5,6);}},
  verde:{h:7,f:function(y){return onda(y,7,'#A8D06C',3,5,3);}},
  bacon:{h:10,f:function(y){return onda(y,10,'#A8412D',5,6)+onda(y+3,3,'#E39B86',3,6);}},
  calabresa:{h:13,f:function(y){var s='';[38,66,94,122,150].forEach(function(x){s+='<ellipse cx="'+x+'" cy="'+(y+7)+'" rx="15" ry="6.5" fill="#9B3A28"/><ellipse cx="'+x+'" cy="'+(y+6)+'" rx="10" ry="3.5" fill="#C2604A"/>';});return s;}},
  presunto:{h:7,f:function(y){return onda(y,7,'#EE9AA2',3,5);}},
  ovo:{h:12,f:function(y){return '<ellipse cx="100" cy="'+(y+6)+'" rx="72" ry="6" fill="#FBF6EC"/><ellipse cx="104" cy="'+(y+4)+'" rx="15" ry="5" fill="#F6B323"/>';}},
  milho:{h:10,f:function(y){var s='';for(var i=0;i<16;i++){s+='<circle cx="'+(30+i*9.4)+'" cy="'+(y+(i%2?6:4))+'" r="4.2" fill="'+(i%3?'#F7C933':'#EDB71E')+'"/>';}return s;}},
  batata:{h:8,f:function(y){var s='';for(var i=0;i<22;i++){var x=28+i*6.6;s+='<path d="M'+x+' '+(y+(i%2?7:2))+'l7 '+(i%2?-5:5)+'" stroke="#EDC46E" stroke-width="2.4" stroke-linecap="round"/>';}return s;}},
  cebola:{h:12,f:function(y){var s='';[46,82,118,154].forEach(function(x){s+='<ellipse cx="'+x+'" cy="'+(y+6)+'" rx="17" ry="6" fill="none" stroke="#D89A3C" stroke-width="5"/>';});return s;}}
};
var MAPA=[['molho verde','verde'],['cebola','cebola'],['batata','batata'],['milho','milho'],['requeij','branco'],['maionese','branco'],['calabresa','calabresa'],['bacon','bacon'],['ovo','ovo'],['cheddar','cheddar'],['queijo','queijo'],['presunto','presunto'],['frango','frango'],['hamb','carne'],['costela','carne'],['tomate','tomate'],['alface','alface']];
var ORDEM=['alface','tomate','carne','frango','presunto','queijo','cheddar','ovo','bacon','calabresa','branco','milho','batata','cebola','verde'];
function ilustraLanche(ingr){
  var tem={}; (ingr||[]).forEach(function(n){ n=n.toLowerCase(); for(var i=0;i<MAPA.length;i++){ if(n.indexOf(MAPA[i][0])>-1){ tem[MAPA[i][1]]=1; break; } } });
  var pilha=['paoB'].concat(ORDEM.filter(function(k){return tem[k]})).concat(['paoT']);
  var tot=pilha.reduce(function(a,k){return a+CAMADAS[k].h-1},0), partes=[], y=100+tot/2+6; pilha.forEach(function(k){ var c=CAMADAS[k]; y-=c.h-1; partes.push(c.f(y)); });
  var esc2=Math.min(1,150/tot);
  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração do lanche"><defs><radialGradient id="g" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#4A3020"/><stop offset="1" stop-color="#2B1D14"/></radialGradient></defs><rect width="200" height="200" fill="url(#g)"/><ellipse cx="100" cy="'+(100+tot*esc2/2+10)+'" rx="82" ry="8" fill="#000" opacity=".25"/><g transform="translate(100 100) scale('+esc2+') translate(-100 -100)">'+partes.join('')+'</g></svg>';
}
function ilustraBebida(it){

  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração da bebida">'+bg+'<rect x="66" y="40" width="68" height="124" rx="12" fill="'+c+'"/><rect x="70" y="34" width="60" height="12" rx="6" fill="#D9D4CA"/><rect x="70" y="158" width="60" height="10" rx="5" fill="#BDB7AC"/><rect x="66" y="84" width="68" height="30" fill="#F5E2BE" opacity=".9"/><rect x="76" y="50" width="7" height="104" rx="3.5" fill="#fff" opacity=".2"/></svg>';
}
function imagem(it,fotos){
  var u=urlFoto(it.foto,fotos);
  if(u) return '<img src="'+u+'" alt="" loading="lazy">';
  if(it.tipoCat==='bebida') return ilustraBebida(it);
  return ilustraLanche(it.ingredientes);
}

/* ---------- Índices ---------- */
var porId={};
function indexar(){
  porId={};
  ESTADO.cardapio.forEach(function(c){ c.itens.forEach(function(i){ i.tipoCat=c.tipo; porId[i.id]=i; }); });
  ESTADO.promocoes.forEach(function(p){ porId['promo:'+p.id]={id:'promo:'+p.id,nome:p.titulo,desc:p.desc,preco:p.preco,foto:p.foto,tipoCat:'promo',ingredientes:null,esgotado:!p.ativo}; });
}
indexar();
var addPorId={}; ESTADO.adicionais.forEach(function(a){addPorId[a.id]=a});

/* ---------- Carrinho: linhas {k,id,q,adds[],nota} ---------- */
var carrinho=[];
try{ carrinho=JSON.parse(localStorage.getItem('bdv-pedido')||'[]')||[]; }catch(e){ carrinho=[]; }
carrinho=carrinho.filter(function(l){ return porId[l.id] && l.q>0 && !porId[l.id].esgotado; });
carrinho.forEach(function(l){ l.adds=(l.adds||[]).filter(function(a){return addPorId[a]}); });
function salvar(){ try{ localStorage.setItem('bdv-pedido',JSON.stringify(carrinho)); }catch(e){} }
function chave(id,adds,nota){ return id+'|'+adds.slice().sort().join(',')+'|'+(nota||''); }
function precoLinha(l){
  var b=porId[l.id].preco; if(b==null) return null;
  for(var i=0;i<l.adds.length;i++){ var p=addPorId[l.adds[i]].preco; if(p==null) return null; b+=p; }
  return b*l.q;
}
function adicionar(id,q,adds,nota){
  adds=adds||[]; var k=chave(id,adds,nota);
  var l=carrinho.find(function(x){return x.k===k});
  if(l) l.q+=q; else carrinho.push({k:k,id:id,q:q,adds:adds,nota:nota||''});
  salvar(); atualizar(); var b=$('abrir'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
}
function qtdDe(id){ return carrinho.reduce(function(a,l){return a+(l.id===id?l.q:0)},0); }
function resumo(){
  var n=0,t=0,sem=false;
  carrinho.forEach(function(l){ n+=l.q; var p=precoLinha(l); if(p==null) sem=true; else t+=p; });
  return {n:n,total:t,semPreco:sem};
}

function controle(id){ return '<div class="qtd" data-id="'+esc(id)+'"><button class="menos" type="button" aria-label="Remover um">−</button><output>0</output><button class="mais" type="button" aria-label="Adicionar um">+</button></div>'; }

function atualizar(){
  document.querySelectorAll('.qtd[data-id]').forEach(function(el){ var q=qtdDe(el.getAttribute('data-id')); el.querySelector('output').textContent=q; el.classList.toggle('zero',q===0); });
  document.querySelectorAll('.mais-btn[data-q]').forEach(function(b){ var q=qtdDe(b.getAttribute('data-q')); b.innerHTML=q?'<span class="n">'+q+'</span>':'+'; });
  var h='';
  if(!carrinho.length) h='<p class="vazio-msg">Seu pedido está vazio. Toque em + no cardápio para adicionar.</p>';
  carrinho.forEach(function(l){
    var i=porId[l.id], p=precoLinha(l);

      (l.adds.length?'<div class="add">+ '+esc(l.adds.map(function(a){return addPorId[a].nome}).join(', '))+'</div>':'')+
      (l.nota?'<div class="nota">'+esc(l.nota)+'</div>':'')+
      '<div class="sub">'+(p==null?'Preço a definir':brl(p))+'</div></div>'+controleLinha(l.k)+'</div>';
  });
  $('linhas').innerHTML=h;
  document.querySelectorAll('#linhas .qtd').forEach(function(el){ var l=carrinho.find(function(x){return x.k===el.getAttribute('data-k')}); el.querySelector('output').textContent=l?l.q:0; });
  var r=resumo();
  $('barraN').textContent=r.n;
  $('barraTotal').textContent=r.semPreco?'':brl(r.total);
  $('totalBox').innerHTML=carrinho.length?'<div class="total"><span>Total</span><span>'+(r.semPreco?'A confirmar':brl(r.total))+'</span></div>'+(r.semPreco?'<p class="total-nota">O valor final é confirmado pela loja no WhatsApp.</p>':''):'';
  $('enviar').disabled=!carrinho.length;
  barraVisivel();
}

var R=null, FR=null, artApi=null, podeEditar=null, aba='resumo', filtroCat=0, abertos={}, base='';

var ICO={
  olho:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  cadeado:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  seta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  logo:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 14a11 8 0 0 1 22 0z"/><path d="M4 18h24"/><path d="M5 22h22l-1.5 3.5h-19z"/></svg>'
};

async function checarAcesso(){
  if(podeEditar!==null) return podeEditar;
  try{
    if(!window.claude||!window.claude.use){ podeEditar=false; return false; }
    var u=await window.claude.use('user');
    artApi=await window.claude.use('artifact');
    podeEditar=!!(u && artApi && await u.canEdit());
  }catch(e){ podeEditar=false; }
  return podeEditar;
}
function querDono(){ var v=false; try{ v=sessionStorage.getItem('bdv-voltar-dono')==='1'; sessionStorage.removeItem('bdv-voltar-dono'); }catch(e){} return location.hash==='#dono'||v; }
async function rota(){
  if(!querDono()){ fecharDono(); return; }
  if(!(await checarAcesso())){ history.replaceState(null,'',location.pathname+location.search); return; }
  $('dono').classList.add('on'); document.body.style.overflow='hidden';
  if(sessaoValida()) entrar(); else telaTrava();
}
window.addEventListener('hashchange',rota);
rota();
function fecharDono(){ $('dono').classList.remove('on'); if(!aberto) document.body.style.overflow=''; }
function sair(){ history.replaceState(null,'',location.pathname+location.search); fecharDono(); }

/* ---------- Senha ---------- */
function hex(b){ return [].map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join(''); }
async function derivar(pin,salt){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256));
}
function sessaoValida(){ try{ var t=+sessionStorage.getItem('bdv-sessao'); return t && Date.now()-t < SESSAO_MIN*60000; }catch(e){ return false; } }
function marcarSessao(){ try{ sessionStorage.setItem('bdv-sessao',String(Date.now())); }catch(e){} }
function bloquear(){ try{ sessionStorage.removeItem('bdv-sessao'); }catch(e){} telaTrava(); }
['click','input','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,function(){ if($('dono').classList.contains('on')&&R){ ultimaAcao=Date.now(); marcarSessao(); } },{passive:true}); });
setInterval(function(){ if($('dono').classList.contains('on')&&R&&Date.now()-ultimaAcao>SESSAO_MIN*60000){ guardarRascunho(); R=null; bloquear(); } },20000);

var trava={pin:'',modo:'',primeiro:'',erros:0,ate:0};
function telaTrava(){
  var sec=ESTADO.seguranca;
  trava={pin:'',modo:sec&&sec.hash?'entrar':'criar',primeiro:'',erros:+(sessionStorage.getItem('bdv-erros')||0),ate:+(sessionStorage.getItem('bdv-ate')||0)};
  $('dono').innerHTML='<div class="trava"><div class="trava-box"><span class="logo">'+ICO.logo+'BURGUER DO VALE</span>'+
    '<h2 class="display" id="tvTit"></h2><p id="tvMsg"></p><div class="pontos" id="tvPts">'+'<i></i>'.repeat(6)+'</div>'+
    '<div class="teclado" id="tvTec">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button type="button" data-n="'+n+'">'+n+'</button>'}).join('')+
    '<span class="vz"></span><button type="button" data-n="0">0</button><button type="button" class="apagar" data-n="x" aria-label="Apagar">⌫</button></div>'+
    '<button class="trava-sair" type="button" id="tvSair">Voltar ao cardápio</button></div></div>';
  textoTrava();
  $('tvSair').onclick=sair;
}
function textoTrava(msg,ruim){
  var t={entrar:'Digite sua senha',criar:'Crie uma senha',confirmar:'Repita a senha'}[trava.modo];
  var d={entrar:'Painel protegido. 6 dígitos.',criar:'Primeiro acesso: escolha 6 dígitos que só você saiba.',confirmar:'Digite a mesma senha de novo.'}[trava.modo];
  $('tvTit').textContent=t; var m=$('tvMsg'); m.textContent=msg||d; m.className=ruim?'ruim':'';
  [].forEach.call($('tvPts').children,function(p,i){ p.classList.toggle('on',i<trava.pin.length); });
  var esperando=Date.now()<trava.ate;
  [].forEach.call($('tvTec').querySelectorAll('button'),function(b){ b.disabled=esperando; });
  if(esperando){ m.textContent='Muitas tentativas. Aguarde '+Math.ceil((trava.ate-Date.now())/1000)+' s.'; m.className='ruim'; setTimeout(function(){ if($('tvMsg')) textoTrava(); },1000); }
}
$('dono').addEventListener('click',function(e){
  var b=e.target.closest('#tvTec button'); if(!b||b.disabled) return;
  var n=b.getAttribute('data-n');
  if(n==='x') trava.pin=trava.pin.slice(0,-1); else if(trava.pin.length<6) trava.pin+=n;
  textoTrava();
  if(trava.pin.length===6) setTimeout(conferirPin,120);
});
document.addEventListener('keydown',function(e){ if(!$('tvTec')) return; if(/^[0-9]$/.test(e.key)){ var b=$('tvTec').querySelector('[data-n="'+e.key+'"]'); if(b) b.click(); } else if(e.key==='Backspace'){ $('tvTec').querySelector('[data-n="x"]').click(); } });
function tremer(){ var p=$('tvPts'); p.classList.remove('treme'); void p.offsetWidth; p.classList.add('treme'); }
async function conferirPin(){
  var pin=trava.pin; trava.pin='';
  if(trava.modo==='criar'){
    if(/^(\d)\1{5}$/.test(pin)||pin==='123456'||pin==='654321'){ tremer(); textoTrava('Senha fácil demais. Escolha outra.',true); return; }
    trava.primeiro=pin; trava.modo='confirmar'; textoTrava(); return; }
  if(trava.modo==='confirmar'){
    if(pin!==trava.primeiro){ tremer(); trava.modo='criar'; textoTrava('As senhas não batem. Comece de novo.',true); return; }
    var salt=hex(crypto.getRandomValues(new Uint8Array(16)));
    textoTrava('Salvando senha…');
    var e=clone(ESTADO); limparTipos(e); e.seguranca={salt:salt,hash:await derivar(pin,salt)};
    marcarSessao(); try{ sessionStorage.setItem('bdv-voltar-dono','1'); }catch(x){}
    try{ await artApi.publish(montarHTML(e,FOTOS)); textoTrava('Senha criada. Abrindo o painel…'); }
    catch(err){ try{ sessionStorage.removeItem('bdv-sessao'); }catch(x){} trava.modo='criar'; textoTrava(msgErro(err),true); }
    return; }
  textoTrava('Conferindo…');
  var ok=(await derivar(pin,ESTADO.seguranca.salt))===ESTADO.seguranca.hash;
  if(ok){ try{ sessionStorage.removeItem('bdv-erros'); sessionStorage.removeItem('bdv-ate'); }catch(x){} marcarSessao(); entrar(); return; }
  trava.erros++; tremer();
  if(trava.erros>=5){ trava.ate=Date.now()+60000; trava.erros=0; }
  try{ sessionStorage.setItem('bdv-erros',String(trava.erros)); sessionStorage.setItem('bdv-ate',String(trava.ate)); }catch(x){}
  textoTrava('Senha errada.'+(trava.erros?' Tentativa '+trava.erros+' de 5.':''),true);
}

/* ---------- Entrar / rascunho ---------- */
function limparTipos(e){ e.cardapio.forEach(function(c){ c.itens.forEach(function(i){ delete i.tipoCat; }); }); }
function guardarRascunho(){ if(!R) return; try{ sessionStorage.setItem('bdv-rascunho',JSON.stringify({e:R,f:FR})); }catch(e){} }
function entrar(){
  var g=null; try{ g=JSON.parse(sessionStorage.getItem('bdv-rascunho')||'null'); sessionStorage.removeItem('bdv-rascunho'); }catch(e){}
  var orig=clone(ESTADO); limparTipos(orig); base=JSON.stringify(orig)+'§'+Object.keys(FOTOS).sort().join(',');
  if(g&&g.e){ R=g.e; FR=g.f; } else { R=orig; FR=clone(FOTOS); }
  ultimaAcao=Date.now(); renderDono();
}
function mudancas(){
  if(!R) return 0;
  var a=JSON.parse(base.split('§')[0]), n=0;
  (function cmp(x,y){ if(typeof x!=='object'||x===null||typeof y!=='object'||y===null){ if(JSON.stringify(x)!==JSON.stringify(y)) n++; return; }
    var ks={}; Object.keys(x).concat(Object.keys(y)).forEach(function(k){ks[k]=1}); Object.keys(ks).forEach(function(k){ cmp(x[k],y[k]); }); })(a,R);
  return n;
}

/* ---------- Helpers ---------- */
function precoV(p){ return p==null?'':String(p).replace('.',','); }
function lerPreco(v){ v=String(v).trim().replace(/\s/g,'').replace(/^R\$/,'').replace(/\./g,'').replace(',','.'); if(v==='') return null; var n=Number(v); return isFinite(n)&&n>=0?Math.round(n*100)/100:undefined; }
function setK(k,v){ var p=k.split('.'), o=R; for(var i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=v; }
function thumbD(o,tipo){ return '<div class="thumb">'+imagem({foto:o.foto,ingredientes:o.ingredientes||(o.foto&&buscaItem(o.foto)||{}).ingredientes,tipoCat:tipo,cor:o.cor,forma:o.forma},FR)+'</div>'; }
function buscaItem(id){ var r=null; R.cardapio.forEach(function(c){ c.itens.forEach(function(i){ if(i.id===id||i.foto===id) r=r||i; }); }); return r; }
function inPreco(k,v,rot){ return '<label class="preco-in"><span>R$</span><input data-k="'+k+'" data-t="num" inputmode="decimal" value="'+esc(precoV(v))+'" placeholder="0,00" aria-label="'+esc(rot)+'"></label>'; }
function campo(rot,k,v,ph,t,dica){ return '<div class="campo"><label class="rot">'+rot+'</label>'+(t==='area'?'<textarea data-k="'+k+'" data-t="txt" placeholder="'+esc(ph||'')+'">'+esc(v)+'</textarea>':'<input data-k="'+k+'" data-t="'+(t||'txt')+'" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'">')+(dica?'<p class="dica-campo">'+dica+'</p>':'')+'</div>'; }
function btnFoto(k,tem){ return '<label class="chip-btn">📷 '+(tem?'Trocar foto':'Enviar foto')+'<input type="file" accept="image/*" class="sr" data-foto="'+k+'"></label>'+(tem?'<button class="chip-btn" type="button" data-acao="rm-foto" data-k="'+k+'">Usar ilustração</button>':''); }
function toast(t,ruim){ var el=$('toast'); if(!el) return; el.textContent=t; el.className='toast on'+(ruim?' ruim':''); clearTimeout(toast.t); toast.t=setTimeout(function(){ el.className='toast'+(ruim?' ruim':''); },2600); }
function contar(){
  var semPreco=0, esg=0;
  R.cardapio.forEach(function(c){ c.itens.forEach(function(i){ if(i.preco==null) semPreco++; if(i.esgotado) esg++; }); });
  R.adicionais.forEach(function(a){ if(a.preco==null) semPreco++; });
  return {semPreco:semPreco,esg:esg,promos:R.promocoes.filter(function(p){return p.ativo}).length};
}
function msgErro(err){
  var c=err&&err.code;
  if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared') return 'Esta conta não tem permissão para salvar.';
  if(c==='too_large') return 'O site ficou grande demais. Remova algumas fotos.';
  if(c==='rate_limited') return 'Muitas publicações seguidas. Espere um minuto.';
  if(c==='conflict') return 'Outra versão foi publicada. Recarregando…';
  return 'Não deu para publicar agora. Tente de novo.';
}

function confirmar(tit,txt,ok,fn,perigo,lista){
  $('modalBox').innerHTML='<h3>'+esc(tit)+'</h3><p>'+esc(txt)+'</p>'+(lista?'<ul>'+lista.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'<div class="d-row"><button class="chip-btn" type="button" id="mNao">Cancelar</button><button class="chip-btn '+(perigo?'perigo':'forte')+'" type="button" id="mSim">'+esc(ok)+'</button></div>';
  $('modal').classList.add('on'); $('mSim').focus();
  $('mNao').onclick=function(){ $('modal').classList.remove('on'); };
  $('mSim').onclick=function(){ $('modal').classList.remove('on'); fn(); };
}
function pedirPublicar(){
  var c=contar(), avisos=[];
  if(c.semPreco) avisos.push(c.semPreco+' itens continuam sem preço');
  if(!String(R.whatsapp||'').replace(/\D/g,'')) avisos.push('WhatsApp ainda não configurado');
  avisos.push(c.promos+' promoç'+(c.promos===1?'ão ativa':'ões ativas')+', '+c.esg+' esgotado'+(c.esg===1?'':'s'));
  confirmar('Publicar no site?','Todo mundo que abrir o cardápio vai ver a nova versão.','Publicar',publicar,false,avisos);
}
async function publicar(){
  var btn=document.querySelector('[data-acao="publicar"]'); if(btn) btn.disabled=true;
  var e=clone(R); limparTipos(e); e.seguranca=ESTADO.seguranca;
  e.destaques=e.destaques.filter(function(d){ return e.cardapio.some(function(c){ return c.itens.some(function(i){return i.id===d.id}); }); });
  toast('Publicando…');
  try{ sessionStorage.setItem('bdv-voltar-dono','1'); }catch(x){}
  try{ await artApi.publish(montarHTML(e,FR)); toast('Publicado! Atualizando…'); }
  catch(err){
    if(err&&err.code==='conflict'){ guardarRascunho(); toast(msgErro(err)); return; }
    try{ sessionStorage.removeItem('bdv-voltar-dono'); }catch(x){}
    if(btn) btn.disabled=false; toast(msgErro(err),true);
  }
}
function reduzirFoto(file){
  return new Promise(function(ok,erro){
    var fr=new FileReader(); fr.onerror=erro;
    fr.onload=function(){ var im=new Image(); im.onerror=erro; im.onload=function(){
      var m=900, s=Math.min(1,m/Math.max(im.width,im.height)), cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); ok(cv.toDataURL('image/jpeg',0.78)); }; im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
function jsonSeguro(o){ return JSON.stringify(o).replace(/</g,'\\u003c'); }
function montarHTML(estado,fotos){
  var usadas={hero:1};
  estado.promocoes.forEach(function(p){ if(p.foto) usadas[p.foto]=1; });
  estado.cardapio.forEach(function(c){ c.itens.forEach(function(i){ if(i.foto) usadas[i.foto]=1; }); });
  var f={}; Object.keys(usadas).forEach(function(k){ if(fotos[k]) f[k]=fotos[k]; });
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n'+HEAD+'\n<style id="css">'+document.getElementById('css').textContent+'</style>\n</head>\n<body>\n<div id="raiz"></div>\n'+
    document.getElementById('corpo').outerHTML+'\n<script type="application/json" id="estado">'+jsonSeguro(estado)+'<\/script>\n'+
    '<script type="application/json" id="fotos">'+jsonSeguro(f)+'<\/script>\n<script id="app">'+document.getElementById('app').textContent+'<\/script>\n</body>\n</html>';
}
})();
